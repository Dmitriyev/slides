name: slides
services:
  api:
    image: slides-api:${SLIDES_RELEASE:-latest}
    build: ..
    restart: unless-stopped
    env_file: ${SLIDES_ENV_FILE:-/opt/slides/slides.env}
    ports:
      - "${SLIDES_BIND_IP:-0.0.0.0}:8280:8280"
    mem_limit: 768m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, /app/slides-api, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
